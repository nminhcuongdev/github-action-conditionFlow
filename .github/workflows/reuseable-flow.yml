name: Reusable Deploy
on: 
  workflow_call:
    inputs:
        artifact-name:
            description: Name of the artifact to deploy
            required: false
            default: dist-files
            type: string

jobs: 
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: get code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}
            - name: list files
              run: ls
            - name: Output information
              run: echo "Deploy and uploading..."